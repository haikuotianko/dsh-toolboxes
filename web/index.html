<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工具箱</title>
<style>
  :root { color-scheme: dark light; --bg:#0f1216; --text:#e7e9ec; --sub:#8b95a1; --line:#252b33; --panel:#161b21; --brand:#4c8dff; --err:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f7f9; --text:#14181d; --sub:#5d6672; --line:#dfe3e8; --panel:#eef1f4; --brand:#2563eb; --err:#c0392b; } }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:10px; align-items:center; padding-block:14px; padding-inline:max(18px, calc((100% - 1040px) / 2)); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { font-size:16px; margin:0; }
  .muted { color:var(--sub); font-size:12px; }
  .err { color:var(--err); }
  button { font:inherit; padding:4px 10px; border-radius:7px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--panel); }
  button:disabled { opacity:.45; cursor:default; }
  main { max-width:1040px; margin:0 auto; padding:16px 18px 48px; }
  .sec { margin-top:20px; }
  .sec > h2 { display:flex; align-items:baseline; gap:8px; font-size:14px; margin:0; padding:7px 0; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .sec > h2 .caret { color:var(--sub); width:12px; display:inline-block; }
  .sec > h2 .summ { color:var(--sub); font-size:11.5px; font-weight:400; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sec > .body { margin-top:9px; }
  .card { border:1px solid var(--line); border-radius:9px; margin-bottom:8px; background:var(--panel); }
  .card.open { background:var(--bg); }
  .card:hover { border-color:var(--brand); }
  .card > .head { display:flex; gap:10px; align-items:center; padding:8px 12px; cursor:pointer; }
  .card > .head .caret { color:var(--sub); width:10px; }
  .card > .head .title { font-family:ui-monospace,Consolas,monospace; font-weight:600; }
  .card > .head .desc { color:var(--sub); font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card > .detail { display:none; padding:0 12px 10px; border-top:1px solid var(--line); margin-top:2px; }
  .card.open > .detail { display:block; }
  .row { display:flex; gap:8px; align-items:center; margin-top:6px; font-size:11.5px; }
  .row .url { flex:1; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { height:6px; border-radius:4px; background:var(--panel); overflow:hidden; margin-top:7px; }
  .bar > i { display:block; height:100%; background:var(--brand); width:0; transition:width .2s linear; }
  input { font:inherit; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:inherit; }
  pre { background:var(--panel); padding:8px; border-radius:6px; white-space:pre-wrap; max-height:220px; overflow:auto; font-size:11.5px; margin:6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>工具箱</h1>
  <span class="muted" id="meta">…</span>
  <span style="margin-left:auto"></span>
  <button id="btn-env">检查本机环境</button>
  <button id="btn-refresh">刷新</button>
</header>
<main>
  <div id="msg" class="muted"></div>
  <div id="job"></div>

  <div class="sec" id="sec-env">
    <h2 data-toggle><span class="caret">▸</span> 本机环境 <span class="summ" id="env-summ">PATH 里已有哪些预设工具</span></h2>
    <div class="body" id="env-body" hidden></div>
  </div>

  <div class="sec" id="sec-installed">
    <h2 data-toggle><span class="caret">▸</span> <span id="h-installed">已安装</span> <span class="summ" id="installed-summ"></span></h2>
    <div class="body" id="installed" hidden></div>
  </div>

  <div class="sec" id="sec-available">
    <h2 data-toggle><span class="caret">▸</span> <span id="h-available">可安装</span> <span class="summ" id="available-summ"></span></h2>
    <div class="body" id="available" hidden><div id="cats" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div><div id="avail-list"></div></div>
  </div>

  <div class="sec" id="sec-scripts">
    <h2 data-toggle><span class="caret">▸</span> <span id="h-scripts">脚本</span> <span class="summ" id="scripts-summ"></span></h2>
    <div class="body" id="scripts" hidden>
      <div class="card"><div class="head"><button id="btn-new-script">+ 新建脚本</button><span class="muted">运行时按 usage 预填参数</span></div></div>
    </div>
  </div>

  <div class="sec">
    <h2 data-toggle><span class="caret">▸</span> AI 不主动用工具箱？ <span class="summ">复制一段话发给 AI，让它自己写进 AGENTS.md</span></h2>
    <div class="body" hidden>
      <div class="card"><div class="detail" style="display:block">
        <p class="muted" style="margin:6px 0">复制下面这段，直接发给你的 AI；它会自己写进 AGENTS.md：</p>
        <textarea id="agents-hint" readonly rows="10" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:inherit"></textarea>
        <div class="row"><button id="btn-copy">复制这段规则</button><span class="muted" id="copy-state"></span></div>
      </div></div>
    </div>
  </div>
  <div class="sec">
    <h2 style="cursor:default"><span class="caret"> </span> 自定义链接安装</h2>
    <div class="body"><div class="card"><div class="head">
      <input id="cid" placeholder="工具 id" style="width:140px">
      <input id="curl" placeholder="https 直链" class="desc" style="background:var(--panel)">
      <button id="btn-custom">下载并安装</button>
    </div></div></div>
  </div>
</main>
<script>
const API = '/api';
const $ = (id) => document.getElementById(id);
const kb = (n) => Math.round((n || 0) / 1024) + ' KB';
const rate = (n) => (n > 0 ? Math.round(n / 1024) + ' KB/s' : '-');
let job = null;
const open = { env: false, installed: true, available: false, scripts: false };

async function api(path, init) {
  const res = await fetch(API + path, init);
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { error: text }; }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const post = (p, b) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) });
const show = (t, bad) => { $('msg').textContent = t || ''; $('msg').className = bad ? 'err' : 'muted'; };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}

function applyOpen() {
  document.querySelectorAll('.sec').forEach((sec) => {
    const body = sec.querySelector('.body');
    if (!body) return;
    const key = sec.id.replace('sec-', '');
    const isOpen = key && Object.prototype.hasOwnProperty.call(open, key) ? open[key] : !body.hidden;
    body.hidden = !isOpen;
    const caret = sec.querySelector('.caret');
    if (caret) caret.textContent = isOpen ? '▾' : '▸';
  });
}
// Every collapsible header toggles its own body; keyed sections also sync state
// so that programmatic changes (e.g. env auto-open) keep working.
document.querySelectorAll('h2[data-toggle]').forEach((h) => h.addEventListener('click', () => {
  const sec = h.closest('.sec');
  const body = sec.querySelector('.body');
  const caret = h.querySelector('.caret');
  body.hidden = !body.hidden;
  if (caret) caret.textContent = body.hidden ? '▸' : '▾';
  const key = sec.id.replace('sec-', '');
  if (key && Object.prototype.hasOwnProperty.call(open, key)) open[key] = !body.hidden;
}));

function card(id, title, desc, extra) {
  const box = el('div', { class: 'card' });
  const head = el('div', { class: 'head' }, el('span', { class: 'caret' }, '▸'), el('span', { class: 'title' }, title), el('span', { class: 'desc' }, desc || ''));
  for (const node of (extra || [])) head.append(node);
  const detail = el('div', { class: 'detail' });
  head.addEventListener('click', (event) => {
    if (event.target.closest('button, input')) return;
    box.classList.toggle('open');
    head.querySelector('.caret').textContent = box.classList.contains('open') ? '▾' : '▸';
  });
  box.append(head, detail);
  return { box, detail };
}

async function startInstall(tool, url) {
  try {
    const started = await post('/install', { tool, url });
    job = { id: started.job, tool, phase: 'queued', received: 0, total: 0 };
    renderJob(); poll();
  } catch (e) { show(e.message, true); }
}
async function poll() {
  if (!job) return;
  try {
    const next = await api('/job?id=' + encodeURIComponent(job.id));
    job = next; renderJob();
    if (['done', 'failed', 'cancelled'].includes(next.phase)) {
      if (next.phase === 'failed') show(next.error || '安装失败', true);
      job = null; setTimeout(() => { renderJob(); load(); }, 700); return;
    }
  } catch (e) { show(e.message, true); }
  setTimeout(poll, 500);
}
function renderJob() {
  const host = $('job'); host.innerHTML = '';
  if (!job) return;
  const pct = job.total > 0 ? Math.min(100, Math.round(job.received / job.total * 100)) : 0;
  const label = { measure: '测速中', download: '下载 ' + kb(job.received) + (job.total ? ' / ' + kb(job.total) : '') + ' ' + rate(job.speedBps), extract: '解包中', probe: '探测版本', queued: '排队', cancelled: '已取消(断点保留)', failed: '失败', done: '完成' }[job.phase] || job.phase;
  const box = el('div', { class: 'card' }, el('div', { class: 'head' }, el('span', { class: 'title' }, job.tool), el('span', { class: 'desc' }, label)));
  if (!['done', 'failed', 'cancelled'].includes(job.phase)) box.querySelector('.head').append(el('button', { onclick: () => post('/cancel', { job: job.id }).catch(() => {}) }, '取消'));
  if (job.phase === 'download' || job.phase === 'done') {
    const bar = el('div', { class: 'bar' }, el('i'));
    bar.firstChild.style.width = pct + '%';
    box.append(el('div', { class: 'detail', style: 'display:block' }, bar));
  }
  host.append(box);
}

async function load() {
  try {
    const state = await api('/state');
    $('meta').textContent = state.platform + ' · ' + state.root;
    $('h-installed').textContent = '已安装 · ' + state.installed.length;
    $('installed-summ').textContent = state.installed.map((t) => t.id).join(', ') || '(空)';
    $('h-available').textContent = '可安装 · ' + state.available.length;
    const counts = {};
    for (const t of state.available) counts[t.category || 'dev'] = (counts[t.category || 'dev'] || 0) + 1;
    const names = { media: '媒体', net: '网络', search: '搜索', data: '数据', dev: '开发', ops: '运维', docs: '文档' };
    $('available-summ').textContent = Object.entries(counts).map(([k, v]) => (names[k] || k) + ' ' + v).join(' · ');
    renderInstalled(state.installed);
    renderAvailable(state.available);
    renderCats(state.available);
  } catch (e) { show(e.message, true); }
  loadScripts();
}

function renderInstalled(list) {
  const host = $('installed'); host.innerHTML = '';
  if (!list.length) { host.append(el('div', { class: 'muted' }, '还没有安装任何工具')); return; }
  for (const t of list) {
    const { box, detail } = card(t.id, t.id, t.description || '', [
      t.enabled === false ? el('span', { class: 'err', style: 'font-size:11.5px' }, '已停用') : null,
      el('button', { onclick: async () => { await post('/enable', { tool: t.id, enabled: t.enabled === false }); load(); } }, t.enabled === false ? '启用' : '停用'),
      el('button', { onclick: async () => { const r = await post('/remove', { tool: t.id }); show(t.id + ' 已卸载：' + (r.filesRemoved ? '文件已删除' : '仅删除记录，程序文件保留')); load(); } }, '卸载'),
    ]);
    detail.append(el('div', { class: 'row' }, el('span', { class: 'muted' }, '版本'), el('span', {}, t.version || '-')),
      el('div', { class: 'row' }, el('span', { class: 'muted' }, '用法'), el('span', { class: 'url' }, t.usage || '-')));
    host.append(box);
  }
}

const CATS = [['all','全部'],['media','媒体'],['net','网络'],['search','搜索'],['data','数据'],['dev','开发'],['ops','运维'],['docs','文档']];
let catFilter = 'all';
function renderCats(list) {
  const host = $('cats'); host.innerHTML = '';
  for (const [key, label] of CATS) {
    const count = key === 'all' ? list.length : list.filter((t) => (t.category || 'dev') === key).length;
    const active = catFilter === key;
    const btn = el('button', { onclick: () => { catFilter = key; renderCats(list); renderAvailable(list); } }, label + ' ' + count);
    btn.style.borderColor = active ? 'var(--brand)' : 'var(--line)';
    btn.style.color = active ? 'var(--brand)' : 'inherit';
    btn.style.background = active ? 'var(--bg)' : 'transparent';
    host.append(btn);
  }
}
function renderAvailable(list) {
  list = list.filter((t) => catFilter === 'all' || (t.category || 'dev') === catFilter);
  const host = $('avail-list'); host.innerHTML = '';
  if (!list.length) { host.append(el('div', { class: 'muted' }, '目录里的工具都装好了')); return; }
  for (const t of list) {
    const srcs = t.sources || [];
    const { box, detail } = card(t.id, t.id, t.description || '', [
      el('span', { class: 'muted', style: 'font-size:11.5px' }, t.platformMissing ? '无本系统源' : srcs.length + ' 个源'),
      el('button', { disabled: job !== null, onclick: () => startInstall(t.id) }, '安装'),
    ]);
    if (t.platformMissing || !srcs.length) {
      detail.append(el('div', { class: 'row' }, el('span', { class: 'err', style: 'font-size:11.5px' }, '本系统无预设源，请自填链接')));
      const input = el('input', { class: 'url', placeholder: 'https 直链' });
      detail.append(el('div', { class: 'row' }, input, el('button', { onclick: () => startInstall(t.id, input.value.trim()) }, '用这个链接装')));
    }
    for (const s of srcs) {
      detail.append(el('div', { class: 'row' }, el('span', { class: 'url' }, s.url), el('button', { onclick: () => startInstall(t.id, s.url) }, '用这个源装')));
    }
    host.append(box);
  }
}

async function loadScripts() {
  try {
    const data = await api('/scripts');
    const list = data.scripts || [];
    $('h-scripts').textContent = '脚本 · ' + list.length;
    $('scripts-summ').textContent = list.map((s) => s.id).join(', ') || '(空)';
    const host = $('scripts');
    [...host.querySelectorAll('.card.script')].forEach((n) => n.remove());
    for (const s of list) {
      const { box, detail } = card(s.id, s.id, s.description || '', [
        el('span', { class: 'muted', style: 'font-size:11.5px' }, s.language),
        el('button', {
          onclick: async () => {
            let args = '[]';
            const m = /"args"\s*:\s*(\[[^]*?\])/.exec(s.usage || '');
            if (m) { try { args = JSON.stringify(JSON.parse(m[1])); } catch (e) { args = m[1]; } }
            const text = prompt(s.id + ' 的参数（JSON 数组）', args);
            if (text === null) return;
            try {
              const r = await post('/run', { tool: s.id, args: JSON.parse(text) });
              alert('exit=' + r.exitCode + '\n\n' + r.stdout + (r.stderr ? '\n' + r.stderr : ''));
            } catch (e) { alert(e.message); }
          },
        }, '运行'),
        el('button', { onclick: async () => { if (!confirm('删除 ' + s.id + '?')) return; await api('/script', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tool: s.id }) }); loadScripts(); } }, '删除'),
      ]);
      box.classList.add('script');
      detail.append(el('div', { class: 'row' }, el('span', { class: 'muted' }, '用法'), el('span', { class: 'url' }, s.usage || '-')));
      host.append(box);
    }
  } catch (e) { show(e.message, true); }
}

$('btn-refresh').onclick = load;
$('btn-env').onclick = async () => {
  try {
    const data = await api('/env');
    $('env-summ').textContent = '发现 ' + (data.hits || []).length + ' 个：' + (data.hits || []).map((h) => h.id).join(', ');
    const host = $('env-body'); host.innerHTML = '';
    try {
      const rt = await api('/runtimes');
      if ((rt.runtimes || []).length) {
        host.append(el('div', { class: 'muted', style: 'margin:2px 0 6px' }, '编程环境：' + rt.runtimes.map((x) => x.name + ' ' + (x.version || '')).join(' · ')));
      }
    } catch (e) { /* optional */ }
    for (const h of data.hits || []) {
      const { box, detail } = card(h.id, h.id, h.description || '', h.managed ? [el('span', { class: 'muted', style: 'font-size:11.5px' }, '已登记')] : [el('button', { onclick: async () => { await post('/adopt', { tool: h.id, path: h.path }); show(h.id + ' 已登记系统版本'); load(); } }, '使用系统版本')]);
      detail.append(el('div', { class: 'row' }, el('span', { class: 'url' }, h.path)));
      host.append(box);
    }
    open.env = true; applyOpen();
  } catch (e) { show(e.message, true); }
};
$('btn-custom').onclick = () => {
  const id = $('cid').value.trim(), url = $('curl').value.trim();
  if (id && url) startInstall(id, url);
};
$('btn-new-script').onclick = async () => {
  const name = prompt('脚本 id（小写带横线）'); if (!name) return;
  const language = prompt('语言：python | node | powershell', 'python') || 'python';
  const description = prompt('用途（一句话）') || '';
  const usage = prompt('调用示例', 'toolbox_run { tool: "' + name + '", args: [] }') || '';
  const content = prompt('脚本内容（之后可再编辑）', '') || '';
  try { await post('/script', { name, language, description, usage, content }); loadScripts(); } catch (e) { show(e.message, true); }
};


const HINT_TEXT = "我在用工具箱 MCP（工具：toolbox_list / toolbox_run / toolbox_runtimes / toolbox_save_script / toolbox_install）。\n请把下面这些规则写进项目根目录的 AGENTS.md：文件不存在就新建，已存在就追加到末尾（不要覆盖原有内容）。写完后告诉我你改了哪个文件。\n\n## 动手前先看工具箱\n- 需要跑命令或写脚本时，先调用 toolbox_list；能覆盖的通用活优先 toolbox_run，没装先问我要不要装（别一上来就写脚本）。\n- 写脚本前先调用 toolbox_runtimes 确认本机有哪些语言：密集计算/大文件用 Go 或 Rust，文本与数据加工用 Python，Windows 系统操作用 PowerShell 5.1，JSON/HTTP 可用 Node。\n- 脚本写完后如果它通用（输入输出清晰、无项目私有路径或常量），用 toolbox_save_script 存进工具箱，并告诉我 id 与调用方式；一次性的不要存。\n- 工具已经给出结果时不要用另一套实现再复核一遍；只有结果可疑才抽查。\n";
$('agents-hint').value = HINT_TEXT;
$('btn-copy').onclick = async () => {
  try { await navigator.clipboard.writeText(HINT_TEXT); $('copy-state').textContent = '已复制'; }
  catch (e) {
    const ta = $('agents-hint'); ta.select(); document.execCommand('copy');
    $('copy-state').textContent = '已复制（回退方式）';
  }
  setTimeout(() => { $('copy-state').textContent = ''; }, 2500);
};
applyOpen();
load();
</script>
</body>
</html>
